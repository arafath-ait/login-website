<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AIT Play - Secure Admin Panel</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      user-select: none;
    }

    body {
      background: #0b0f17;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    /* Secure Login Window */
    .login-box {
      background: #161e2e;
      border: 1px solid #243044;
      padding: 30px;
      border-radius: 16px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      text-align: center;
    }

    .login-box h2 {
      color: #38bdf8;
      margin-bottom: 20px;
      font-size: 22px;
    }

    input[type="text"], input[type="password"], textarea {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #0b0f17;
      color: #fff;
      font-size: 14px;
      outline: none;
    }
    input:focus, textarea:focus {
      border-color: #38bdf8;
    }

    .btn {
      width: 100%;
      padding: 12px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn:hover { background: #1d4ed8; }
    .btn-success { background: #10b981; }
    .btn-success:hover { background: #059669; }

    /* Main Admin Panel Dashboard */
    .admin-container {
      display: none;
      width: 100%;
      max-width: 800px;
      background: #161e2e;
      border: 1px solid #243044;
      border-radius: 16px;
      padding: 25px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    }

    .admin-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #243044;
      padding-bottom: 15px;
      margin-bottom: 20px;
    }

    .nav-tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .tab-btn {
      padding: 10px 20px;
      background: #0b0f17;
      color: #94a3b8;
      border: 1px solid #243044;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
    }

    .tab-btn.active {
      background: #38bdf8;
      color: #000;
      border-color: #38bdf8;
    }

    .request-card {
      background: #0b0f17;
      border: 1px solid #243044;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 12px;
    }

    .back-btn {
      background: #dc2626;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      font-size: 13px;
    }
  </style>

  <!-- Firebase SDKs -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Your Firebase Config
    const firebaseConfig = {
      apiKey: "AIzaSyCXMAdXRsyubfJFZRUoXYoYjBWjBZd7VxE",
      authDomain: "ait-game-store.firebaseapp.com",
      projectId: "ait-game-store",
      storageBucket: "ait-game-store.firebasestorage.app",
      messagingSenderId: "146438462272",
      appId: "1:146438462272:web:92a9cea7d1383f650d78a5"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    window.db = db;
    window.collection = collection;
    window.addDoc = addDoc;
    window.getDocs = getDocs;
    window.serverTimestamp = serverTimestamp;
  </script>
</head>
<body>

  <!-- STEP 1: LOGIN FORM -->
  <div class="login-box" id="loginBox">
    <h2>🔐 AIT Admin Login</h2>
    <input type="text" id="adminUser" placeholder="Username">
    <input type="password" id="adminPass" placeholder="Password">
    <button class="btn" onclick="verifyLogin()">Login</button>
  </div>

  <!-- STEP 2: SECURE DASHBOARD -->
  <div class="admin-container" id="adminPanel">
    <div class="admin-header">
      <h2 style="color: #38bdf8;">⚙️ AIT Control Center</h2>
      <a href="https://arafath-ait.github.io/ait-play/" class="back-btn">Go to Store 🌐</a>
    </div>

    <div class="nav-tabs">
      <button class="tab-btn active" id="tabPubBtn" onclick="switchTab('pub')">Publish New Game</button>
      <button class="tab-btn" id="tabReqBtn" onclick="switchTab('req')">Requested Ideas</button>
    </div>

    <!-- PUBLISH GAME TAB -->
    <div id="publishSection">
      <h3 style="margin-bottom: 12px; color: #cbd5e1;">🎮 Add Game HTML Code</h3>
      <input type="text" id="gameTitle" placeholder="Game Title (പേര്)">
      <textarea id="gameHtmlCode" rows="10" placeholder="Paste HTML, CSS, JS code here..."></textarea>
      <button class="btn btn-success" onclick="publishGameToServer()">Publish Live 🚀</button>
    </div>

    <!-- REQUESTED IDEAS TAB -->
    <div id="requestsSection" style="display: none;">
      <h3 style="margin-bottom: 12px; color: #cbd5e1;">📩 Game Ideas from Users</h3>
      <div id="ideasList">Loading requests...</div>
    </div>
  </div>

  <script>
    // Login Verification
    function verifyLogin() {
      const u = document.getElementById('adminUser').value.trim();
      const p = document.getElementById('adminPass').value.trim();

      if (u === "AIT" && p === "2012") {
        document.getElementById('loginBox').style.display = 'none';
        document.getElementById('adminPanel').style.display = 'block';
        loadRequestsFromServer();
      } else {
        alert("അഡ്മിൻ യൂസർനേം അല്ലെങ്കിൽ പാസ്‌വേഡ് തെറ്റാണ്!");
      }
    }

    // Switch Tabs
    function switchTab(tab) {
      if (tab === 'pub') {
        document.getElementById('publishSection').style.display = 'block';
        document.getElementById('requestsSection').style.display = 'none';
        document.getElementById('tabPubBtn').classList.add('active');
        document.getElementById('tabReqBtn').classList.remove('active');
      } else {
        document.getElementById('publishSection').style.display = 'none';
        document.getElementById('requestsSection').style.display = 'block';
        document.getElementById('tabPubBtn').classList.remove('active');
        document.getElementById('tabReqBtn').classList.add('active');
        loadRequestsFromServer();
      }
    }

    // Publish Game to Firebase Database
    async function publishGameToServer() {
      const title = document.getElementById('gameTitle').value.trim();
      const code = document.getElementById('gameHtmlCode').value.trim();

      if (!title || !code) {
        alert("ഗെയിമിന്റെ പേരും HTML കോഡും കൃത്യമായി നൽകുക!");
        return;
      }

      try {
        await window.addDoc(window.collection(window.db, "games"), {
          title: title,
          code: code,
          createdAt: window.serverTimestamp()
        });

        // Backup to LocalStorage as well
        let localGames = JSON.parse(localStorage.getItem('ait_published_games')) || [];
        localGames.push({ id: Date.now(), title: title, code: code });
        localStorage.setItem('ait_published_games', JSON.stringify(localGames));

        document.getElementById('gameTitle').value = '';
        document.getElementById('gameHtmlCode').value = '';

        alert("ഗെയിം വിജയകരമായി ഫയർബേസ് സർവറിലേക്ക് പബ്ലിഷ് ചെയ്തു! 🎉");
      } catch (e) {
        console.error("Error adding document: ", e);
        alert("സർവർ എറർ: പബ്ലിഷ് ചെയ്യാൻ സാധിച്ചില്ല.");
      }
    }

    // Load Requests from Firebase Database
    async function loadRequestsFromServer() {
      const listDiv = document.getElementById('ideasList');
      listDiv.innerHTML = "Loading requests from server...";

      try {
        const querySnapshot = await window.getDocs(window.collection(window.db, "requests"));
        listDiv.innerHTML = "";

        if (querySnapshot.empty) {
          listDiv.innerHTML = "<p style='color:#64748b;'>പുതിയ ഗെയിം ഐഡിയകളൊന്നും വന്നിട്ടില്ല!</p>";
          return;
        }

        querySnapshot.forEach((doc) => {
          const data = doc.data();
          const card = document.createElement('div');
          card.className = 'request-card';
          card.innerHTML = `<p style="color:#f1f5f9; font-size:14px;"><strong>💡 Idea:</strong> ${data.idea}</p>`;
          listDiv.appendChild(card);
        });
      } catch (e) {
        // Fallback to local storage if offline
        let localReqs = JSON.parse(localStorage.getItem('ait_game_requests')) || [];
        listDiv.innerHTML = "";
        if (localReqs.length === 0) {
          listDiv.innerHTML = "<p style='color:#64748b;'>പുതിയ ഗെയിം ഐഡിയകളൊന്നും വന്നിട്ടില്ല!</p>";
          return;
        }
        localReqs.forEach((item) => {
          const card = document.createElement('div');
          card.className = 'request-card';
          card.innerHTML = `<p style="color:#f1f5f9; font-size:14px;"><strong>💡 Idea:</strong> ${item.idea}</p>`;
          listDiv.appendChild(card);
        });
      }
    }
  </script>
</body>
</html>
