<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AIT Play - Admin Panel</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
    body { background: #0f172a; color: #f8fafc; padding: 14px; max-width: 900px; margin: 0 auto; }
    h1 { color: #38bdf8; font-size: 21px; margin-bottom: 14px; display: flex; align-items: center; gap: 10px; }
    .panel-box {
      background: #1e293b; border: 1px solid #334155; border-radius: 12px;
      padding: 15px; margin-bottom: 16px;
    }
    .panel-title { font-size: 16px; font-weight: 700; color: #38bdf8; margin-bottom: 10px; }
    input[type="text"], textarea {
      width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #475569;
      background: #0f172a; color: #f8fafc; margin: 6px 0 10px 0; font-size: 13px;
    }
    .check-row {
      display: inline-flex; align-items: center; gap: 7px; margin: 6px 0 12px 0;
      font-size: 14px; font-weight: 600; color: #facc15; cursor: pointer; user-select: none;
    }
    .check-row input { width: 18px; height: 18px; cursor: pointer; accent-color: #22c55e; }
    .btn-row { display: flex; flex-wrap: wrap; gap: 8px; }
    button {
      border: none; border-radius: 8px; padding: 9px 13px; font-weight: 700;
      font-size: 12px; cursor: pointer; color: #fff; display: inline-flex; align-items: center; gap: 6px;
    }
    .btn-blue { background: #3b82f6; }
    .btn-green { background: #22c55e; }
    .btn-purple { background: #a855f7; }
    .btn-pink { background: #ec4899; }
    .btn-red { background: #ef4444; }
    .list-item {
      background: #0f172a; border: 1px solid #334155; border-radius: 10px;
      padding: 12px; margin-bottom: 10px; display: flex;
      flex-direction: column; gap: 10px;
    }
    .item-top {
      display: flex; justify-content: space-between; align-items: center;
      gap: 10px; flex-wrap: wrap;
    }
    .item-title-wrap {
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    }
    .badge {
      font-size: 11px; padding: 3px 9px; border-radius: 10px; font-weight: 700;
      background: rgba(56, 189, 248, 0.18); color: #38bdf8;
    }
    .badge-web {
      background: rgba(168, 85, 247, 0.22); color: #d8b4fe;
    }
    .item-game-tick {
      display: inline-flex; align-items: center; gap: 5px;
      font-size: 12px; font-weight: 700; color: #facc15; cursor: pointer;
      background: rgba(250, 204, 21, 0.1); padding: 4px 8px; border-radius: 8px;
      border: 1px solid rgba(250, 204, 21, 0.3);
    }
    .item-game-tick input { width: 15px; height: 15px; cursor: pointer; accent-color: #22c55e; }
    #previewOverlay {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.92);
      z-index: 9999; flex-direction: column;
    }
    #previewTop {
      background: #1e293b; padding: 10px 16px; display: flex;
      justify-content: space-between; align-items: center; border-bottom: 1px solid #334155;
    }
    #previewFrame { flex: 1; width: 100%; border: none; background: #fff; }
  </style>
</head>
<body>

  <h1><i class="fa-solid fa-shield-halved"></i> AIT Play Admin Panel</h1>

  <!-- 1. Game / Website Uploader -->
  <div class="panel-box">
    <div class="panel-title">Publish Game / Website</div>
    <input type="text" id="adminItemTitle" placeholder="Game or Website Title">

    <label class="check-row">
      <input type="checkbox" id="adminIsGameCheckbox" checked>
      <span>Game (Uncheck to set as Website)</span>
    </label>

    <textarea id="adminItemCode" rows="6" placeholder="Paste HTML / CSS / JavaScript code here..."></textarea>

    <div class="btn-row">
      <button class="btn-blue" id="adminPreviewBtn"><b>P</b> Preview</button>
      <button class="btn-purple" id="adminCopyCodeBtn"><i class="fa-solid fa-copy"></i> Copy Code</button>
      <button class="btn-green" id="adminPublishBtn"><i class="fa-solid fa-cloud-arrow-up"></i> Publish</button>
    </div>
  </div>

  <!-- 2. Song -> HTML + CSS + JS Converter & Firebase Uploader -->
  <div class="panel-box">
    <div class="panel-title" style="color:#10b981;">Song to HTML / CSS / JS Code & Firebase Uploader</div>
    <input type="text" id="adminSongTitle" placeholder="Song Title">

    <input type="file" id="adminSongFile" accept="audio/*,audio/mpeg,audio/mp3,.mp3,.wav,.m4a,.ogg,.aac" style="margin-bottom:10px; font-size:12px; width:100%;">

    <button class="btn-pink" id="convertSongToCodeBtn" style="margin-bottom:10px;">
      <i class="fa-solid fa-code"></i> Convert Song to HTML + CSS + JS Code
    </button>

    <textarea id="generatedSongBundleCode" rows="5" placeholder="Generated HTML + CSS + JS song code will appear here..."></textarea>

    <div class="btn-row">
      <button class="btn-blue" id="previewSongBundleBtn"><b>P</b> Test Song</button>
      <button class="btn-purple" id="copySongBundleBtn"><i class="fa-solid fa-copy"></i> Copy Song Code</button>
      <button class="btn-green" id="uploadSongBundleBtn"><i class="fa-solid fa-upload"></i> Send Song Code to Firebase</button>
    </div>
  </div>

  <!-- 3. Published Games & Websites List -->
  <div class="panel-box">
    <div class="panel-title">Published Games & Websites</div>
    <div id="adminItemsList">Loading...</div>
  </div>

  <!-- Fullscreen Preview Modal -->
  <div id="previewOverlay">
    <div id="previewTop">
      <span id="previewLabel" style="font-weight:bold; color:#38bdf8;">Preview</span>
      <button class="btn-red" id="closePreviewBtn"><i class="fa-solid fa-xmark"></i> Close</button>
    </div>
    <iframe id="previewFrame" src="about:blank"></iframe>
  </div>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCXMAdXRsyubfJFZRUoXYoYjBWjBZd7VxE",
      authDomain: "ait-game-store.firebaseapp.com",
      projectId: "ait-game-store",
      storageBucket: "ait-game-store.firebasestorage.app",
      messagingSenderId: "146438462272",
      appId: "1:146438462272:web:92a9cea7d1383f650d78a5"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let publishedItems = [];

    function isItemGame(item) {
      if (item.category === 'website' || item.isGame === false) return false;
      return true;
    }

    function openAdminPreview(htmlCode, label = "Preview") {
      if (!htmlCode) return alert("Nothing to preview!");
      document.getElementById('previewLabel').innerText = label;
      document.getElementById('previewOverlay').style.display = 'flex';
      const doc = document.getElementById('previewFrame').contentWindow.document;
      doc.open();
      doc.write(htmlCode);
      doc.close();
    }

    document.getElementById('closePreviewBtn').onclick = () => {
      document.getElementById('previewOverlay').style.display = 'none';
      document.getElementById('previewFrame').src = 'about:blank';
    };

    document.getElementById('adminPreviewBtn').onclick = () => {
      openAdminPreview(document.getElementById('adminItemCode').value, document.getElementById('adminItemTitle').value || "Preview");
    };

    document.getElementById('adminCopyCodeBtn').onclick = () => {
      const code = document.getElementById('adminItemCode').value;
      if (!code) return alert("No code to copy!");
      navigator.clipboard.writeText(code).then(() => alert("Code copied!"));
    };

    document.getElementById('adminPublishBtn').onclick = () => {
      const title = document.getElementById('adminItemTitle').value.trim();
      const code = document.getElementById('adminItemCode').value;
      const isGame = document.getElementById('adminIsGameCheckbox').checked;
      if (!title || !code) return alert("Please enter Title and Code!");

      db.collection("published_games").add({
        title,
        code,
        isGame,
        category: isGame ? "game" : "website",
        isStar: false,
        timestamp: firebase.firestore.FieldValue.serverTimestamp()
      }).then(() => {
        alert(`Published as ${isGame ? "Game" : "Website"}!`);
        document.getElementById('adminItemTitle').value = '';
        document.getElementById('adminItemCode').value = '';
      });
    };

    // Convert uploaded audio file (.mp3, .wav, etc.) into HTML + CSS + JS (JS drives playback)
    document.getElementById('convertSongToCodeBtn').onclick = () => {
      const fileInput = document.getElementById('adminSongFile');
      const file = fileInput.files && fileInput.files[0];
      if (!file) return alert("Please choose an audio file (.mp3 / .wav) first!");

      const title = document.getElementById('adminSongTitle').value.trim() || file.name.replace(/\.[^/.]+$/, "");
      document.getElementById('adminSongTitle').value = title;

      const reader = new FileReader();
      reader.onload = (e) => {
        const base64Audio = e.target.result;
        const bundle = `<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    body { margin: 0; padding: 8px; background: #0f172a; color: #10b981; font-family: sans-serif; font-size: 12px; }
    .song-box { display: flex; align-items: center; justify-content: space-between; }
  </style>
</head>
<body>
  <div class="song-box"><span id="songName">${title}</span><span id="songState">Ready</span></div>
  <script>
    const songDataUrl = "${base64Audio}";
    const player = new Audio(songDataUrl);
    player.loop = true;
    function startSong() {
      player.play().then(() => {
        document.getElementById('songState').innerText = 'Playing';
      }).catch(() => {});
    }
    startSong();
    window.addEventListener('click', startSong, { once: true });
  <\/script>
</body>
</html>`;
        document.getElementById('generatedSongBundleCode').value = bundle;
        alert("Song converted to HTML + CSS + JS code!");
      };
      reader.readAsDataURL(file);
    };

    document.getElementById('previewSongBundleBtn').onclick = () => {
      openAdminPreview(document.getElementById('generatedSongBundleCode').value, document.getElementById('adminSongTitle').value || "Song Preview");
    };

    document.getElementById('copySongBundleBtn').onclick = () => {
      const val = document.getElementById('generatedSongBundleCode').value;
      if (!val) return alert("No song code to copy!");
      navigator.clipboard.writeText(val).then(() => alert("Song code copied!"));
    };

    document.getElementById('uploadSongBundleBtn').onclick = () => {
      const title = document.getElementById('adminSongTitle').value.trim();
      const htmlCode = document.getElementById('generatedSongBundleCode').value.trim();
      if (!title || !htmlCode) return alert("Enter song title and convert/paste song code!");

      db.collection("song_codes").add({
        title,
        htmlCode,
        timestamp: firebase.firestore.FieldValue.serverTimestamp()
      }).then(() => {
        alert("Song code sent to Firebase!");
        document.getElementById('adminSongTitle').value = '';
        document.getElementById('generatedSongBundleCode').value = '';
      });
    };

    // Fast rendering with DocumentFragment to avoid UI lag
    db.collection("published_games").orderBy("timestamp", "desc").onSnapshot((snap) => {
      const container = document.getElementById('adminItemsList');
      const frag = document.createDocumentFragment();
      publishedItems = [];

      snap.forEach(doc => {
        const item = { id: doc.id, ...doc.data() };
        publishedItems.push(item);
        const gameChecked = isItemGame(item);

        const row = document.createElement('div');
        row.className = 'list-item';
        row.innerHTML = `
          <div class="item-top">
            <div class="item-title-wrap">
              <b>${item.title}</b>
              <span class="badge ${gameChecked ? '' : 'badge-web'}">${gameChecked ? 'Game' : 'Website'}</span>
            </div>
            <label class="item-game-tick">
              <input type="checkbox" ${gameChecked ? 'checked' : ''} onchange="toggleItemGameType('${doc.id}', this.checked)">
              <span>Game</span>
            </label>
          </div>
          <div class="btn-row">
            <button class="btn-blue" onclick="previewById('${doc.id}')"><b>P</b></button>
            <button class="btn-purple" onclick="copyById('${doc.id}')"><i class="fa-solid fa-copy"></i></button>
            <button class="btn-red" onclick="deleteById('${doc.id}')"><i class="fa-solid fa-trash"></i></button>
          </div>
        `;
        frag.appendChild(row);
      });

      container.innerHTML = '';
      container.appendChild(frag);
    });

    function toggleItemGameType(id, checked) {
      db.collection("published_games").doc(id).update({
        isGame: checked,
        category: checked ? "game" : "website"
      });
    }

    function previewById(id) {
      const found = publishedItems.find(x => x.id === id);
      if (found) openAdminPreview(found.code, found.title);
    }

    function copyById(id) {
      const found = publishedItems.find(x => x.id === id);
      if (found) navigator.clipboard.writeText(found.code || '').then(() => alert(`Copied "${found.title}" code!`));
    }

    function deleteById(id) {
      if (confirm("Delete this item?")) db.collection("published_games").doc(id).delete();
    }
  </script>
</body>
</html>
