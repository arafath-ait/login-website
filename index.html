<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AIT Play - Admin Panel</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; padding: 20px; }
    
    .login-card { max-width: 350px; margin: 80px auto; background: #1e293b; padding: 30px; border-radius: 12px; border: 1px solid #334155; text-align: center; }
    .login-card input { width: 100%; padding: 10px; margin: 10px 0; background: #0f172a; border: 1px solid #334155; color: #fff; border-radius: 6px; }
    .btn { background: #38bdf8; color: #000; font-weight: bold; padding: 10px; border: none; border-radius: 6px; cursor: pointer; width: 100%; margin-top: 10px; }
    
    .admin-dashboard { display: none; max-width: 800px; margin: 0 auto; }
    .section-box { background: #1e293b; padding: 20px; border-radius: 12px; border: 1px solid #334155; margin-bottom: 20px; }
    .section-box h2 { color: #38bdf8; margin-bottom: 15px; }
    .section-box input, .section-box textarea { width: 100%; padding: 10px; margin-bottom: 10px; background: #0f172a; border: 1px solid #334155; color: #fff; border-radius: 6px; }
    
    .checkbox-container { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; font-size: 14px; cursor: pointer; }
    .checkbox-container input { width: 18px; height: 18px; cursor: pointer; }

    .item-card { background: #0f172a; padding: 15px; border-radius: 8px; border: 1px solid #334155; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
    .action-group { display: flex; gap: 8px; align-items: center; }
    .star-toggle-btn { background: #f59e0b; color: #fff; border: none; padding: 6px 10px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 12px; }
    .delete-btn { background: #ef4444; color: #fff; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 12px; }
  </style>
</head>
<body>

  <!-- Login Screen -->
  <div class="login-card" id="loginBox">
    <h2>AIT Admin Login</h2>
    <input type="text" id="username" placeholder="Username">
    <input type="password" id="password" placeholder="Password">
    <button class="btn" id="loginBtn">Login</button>
  </div>

  <!-- Main Dashboard Screen -->
  <div class="admin-dashboard" id="dashboard">
    <h1 style="margin-bottom: 20px;">AIT Play Control Panel 🛡</h1>
    
    <!-- Game Publish Box -->
    <div class="section-box">
      <h2>Publish New Game 🚀</h2>
      <input type="text" id="gameTitle" placeholder="Game Title">
      <textarea id="gameCode" rows="6" placeholder="Paste Full HTML/CSS/JS Code Here..."></textarea>
      <label class="checkbox-container">
        <input type="checkbox" id="isStarGame"> Mark as Star Game (Featured ⭐)
      </label>
      <button class="btn" id="publishBtn" style="background: #22c55e; color: #fff;">Publish Live</button>
    </div>

    <!-- Music URL Link Box (GitHub Link Upload) -->
    <div class="section-box">
      <h2>Add Music via GitHub URL 🎵</h2>
      <input type="text" id="musicName" placeholder="Song Name (e.g. Synthwave Anthem)">
      <input type="text" id="musicUrl" placeholder="Paste GitHub Raw MP3 Link here...">
      <button class="btn" id="addMusicBtn" style="background: #a855f7; color: #fff;">Add Music to Playlist</button>
    </div>

    <!-- Manage Music Box -->
    <div class="section-box">
      <h2>Manage Playlist 🎶</h2>
      <div id="musicContainer">Loading music tracks...</div>
    </div>

    <!-- Live Games Management Box -->
    <div class="section-box">
      <h2>Manage Live Games 🎮</h2>
      <div id="gamesContainer">Loading live games...</div>
    </div>

    <!-- Requested Ideas Box -->
    <div class="section-box">
      <h2>Requested Ideas List 💡</h2>
      <div id="ideasContainer">Loading ideas...</div>
    </div>
  </div>

  <!-- Firebase Scripts -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCXMAdXRsyubfJFZRUoXYoYjBWjBZd7VxE",
      authDomain: "ait-game-store.firebaseapp.com",
      projectId: "ait-game-store",
      storageBucket: "ait-game-store.firebasestorage.app",
      messagingSenderId: "146438462272",
      appId: "1:146438462272:web:92a9cea7d1383f650d78a5"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    document.getElementById('loginBtn').onclick = () => {
      const u = document.getElementById('username').value;
      const p = document.getElementById('password').value;
      if(u === "AIT" && p === "2012") {
        document.getElementById('loginBox').style.display = 'none';
        document.getElementById('dashboard').style.display = 'block';
        loadGames();
        loadIdeas();
        loadMusic();
      } else {
        alert("Wrong Credentials!");
      }
    };

    document.getElementById('publishBtn').onclick = () => {
      const title = document.getElementById('gameTitle').value.trim();
      const code = document.getElementById('gameCode').value.trim();
      const isStar = document.getElementById('isStarGame').checked;

      if(title && code) {
        db.collection("published_games").add({
          title: title,
          code: code,
          isStar: isStar,
          timestamp: firebase.firestore.FieldValue.serverTimestamp()
        }).then(() => {
          alert("Game Published Successfully! 🎉");
          document.getElementById('gameTitle').value = '';
          document.getElementById('gameCode').value = '';
          document.getElementById('isStarGame').checked = false;
        });
      } else {
        alert("Please fill all fields!");
      }
    };

    // Add Music Link Logic
    document.getElementById('addMusicBtn').onclick = () => {
      const name = document.getElementById('musicName').value.trim();
      const url = document.getElementById('musicUrl').value.trim();

      if(name && url) {
        db.collection("bg_music").add({
          name: name,
          url: url,
          timestamp: firebase.firestore.FieldValue.serverTimestamp()
        }).then(() => {
          alert("Music Added Successfully! 🎵");
          document.getElementById('musicName').value = '';
          document.getElementById('musicUrl').value = '';
        }).catch((err) => {
          alert("Error adding music!");
        });
      } else {
        alert("Please enter song name and GitHub URL!");
      }
    };

    function loadMusic() {
      const container = document.getElementById('musicContainer');
      db.collection("bg_music").orderBy("timestamp", "desc").onSnapshot((snapshot) => {
        container.innerHTML = '';
        if(snapshot.empty) {
          container.innerHTML = "<p>No custom music added yet!</p>";
          return;
        }
        snapshot.forEach((doc) => {
          const music = doc.data();
          const card = document.createElement('div');
          card.className = 'item-card';
          card.innerHTML = `
            <div>
              <strong>🎵 ${music.name}</strong><br>
              <audio controls style="height: 30px; margin-top: 5px; width: 200px;" src="${music.url}"></audio>
            </div>
            <button class="delete-btn" onclick="deleteMusic('${doc.id}')">❌ Delete</button>
          `;
          container.appendChild(card);
        });
      });
    }

    function deleteMusic(id) {
      if(confirm("ഈ പാട്ട് ഡിലീറ്റ് ചെയ്യണം എന്ന് ഉറപ്പാണോ?")) {
        db.collection("bg_music").doc(id).delete().then(() => {
          alert("Music Deleted Successfully! 🗑️");
        });
      }
    }

    function loadGames() {
      const container = document.getElementById('gamesContainer');
      db.collection("published_games").orderBy("timestamp", "desc").onSnapshot((snapshot) => {
        container.innerHTML = '';
        if(snapshot.empty) {
          container.innerHTML = "<p>No live games found!</p>";
          return;
        }
        snapshot.forEach((doc) => {
          const game = doc.data();
          const card = document.createElement('div');
          card.className = 'item-card';
          card.innerHTML = `
            <div>
              <strong>🎮 ${game.title}</strong> ${game.isStar ? '⭐ (Star Game)' : ''}
            </div>
            <div class="action-group">
              <button class="star-toggle-btn" onclick="toggleStar('${doc.id}', ${game.isStar || false})">
                ${game.isStar ? '★ Unstar' : '☆ Make Star'}
              </button>
              <button class="delete-btn" onclick="deleteGame('${doc.id}')">❌ Delete</button>
            </div>
          `;
          container.appendChild(card);
        });
      });
    }

    function toggleStar(id, currentStatus) {
      db.collection("published_games").doc(id).update({
        isStar: !currentStatus
      });
    }

    function deleteGame(id) {
      if(confirm("ഈ ഗെയിം വെബ്‌സൈറ്റിൽ നിന്ന് മായ്ച്ചു കളയണം എന്ന് ഉറപ്പാണോ?")) {
        db.collection("published_games").doc(id).delete();
      }
    }

    function loadIdeas() {
      const container = document.getElementById('ideasContainer');
      db.collection("requests").orderBy("timestamp", "desc").onSnapshot((snapshot) => {
        container.innerHTML = '';
        if(snapshot.empty) {
          container.innerHTML = "<p>No request ideas yet!</p>";
          return;
        }
        snapshot.forEach((doc) => {
          const item = doc.data();
          const card = document.createElement('div');
          card.className = 'item-card';
          card.innerHTML = `
            <div>
              <strong>${item.name || 'User'}:</strong> ${item.idea}
            </div>
            <button class="delete-btn" onclick="deleteIdea('${doc.id}')">❌ Delete</button>
          `;
          container.appendChild(card);
        });
      });
    }

    function deleteIdea(id) {
      if(confirm("Delete this idea?")) {
        db.collection("requests").doc(id).delete();
      }
    }
  </script>
</body>
</html>
